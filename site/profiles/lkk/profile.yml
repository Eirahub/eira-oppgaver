# Logo, farger, meny og tekster er hentet fra codeclub-viewer.
# Feltene er forklart i site/README.md.
name: Kodeklubben
url: https://oppgaver.kidsakoder.no
description: >-
  På denne siden finner du oppgaver for barn og unge i alle aldre som ønsker å
  lære programmering. Alt innholdet på siden er gratis å bruke, og er ofte
  benyttet på kodeklubben og programmeringsfag i skolen.

