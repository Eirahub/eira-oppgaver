hero:
  title: Oppgaver
  lead: >-
    Oppgaver for barn og unge i alle aldre som ønsker å lære programmering. Alt
    innholdet er gratis å bruke, og er ofte benyttet på kodeklubben og i
    programmeringsfag i skolen.

teacherInfo: |
  ## Hei! Du er nå i lærermodus

  Er du ikke lærer eller veileder? Trykk på knappen "Lærermodus" øverst på siden
  for å bytte tilbake.

  <details>
  <summary>Mer informasjon</summary>

  ### Lærer

  Sjekk ut våre filtre og oppgaveveiledninger. På kurssiden kan du filtrere på
  ulike skolefag for å finne relevante oppgaver til din undervisning. Hvert
  oppgavesett har en veiledning, og der finner du blant annet hvilke konkrete
  læreplanmål man kan jobbe med i de ulike fagene.

  [Lær mer om programmering i undervisningen](https://www.kidsakoder.no/skole/valgfag/)

  ### Veileder

  Våre oppgavesett legger opp til at barna jobber mye på egenhånd med ulike
  prosjekter, men vi anbefaler å starte hver økt med 10-15 minutter intro til
  hva man skal gjøre og hva som eventuelt er nytt denne gangen. Alle
  oppgavesett har veiledninger du kan sjekke ut som forberedelse til øktene.

  [Lær mer om å drive en kodeklubb](https://www.kidsakoder.no/kodeklubben/)

  </details>

