# Introvideo for Codeling. Felter og skuddtyper: se MANUS.md.
skudd:
  - src: src/codeling/steinsti_og_trapp/program_trapp.png
    H: 540
    look: true
    text: Kan en robot bygge en trapp for deg?
    glow: { x: 0.22, y: 0.36, color: "120, 230, 120" }
  - src: src/codeling/kom_i_gang/editor_tom.png
    look: true
    text: Editoren ligner MakeCode.
    pan: { scale: 1.3, from: [0.39, 0.3], to: [0.6, 0.6] }
  - kind: logo
    course: codeling
    text: Nå får du din egen robot i Minecraft.
    glow: { x: 0.5, y: 0.08, color: "255, 80, 60" }
  - src: src/codeling/steinsti_og_trapp/program_sti.png
    look: true
    H: 560
    text: En steinsti roboten legger mens den går
    glow: { x: 0.25, y: 0.49, color: "255, 220, 80" }
  - kind: code
    code: |
      agent.setItem(Block.OakPlanks, 64, 1)
      for (let index = 0; index < 10; index++) {
          agent.move(SixDirection.Up, 1)
          agent.move(SixDirection.Forward, 1)
          agent.place(SixDirection.Down)
      }
    text: Trappa di, skrevet i JavaScript
  - src: src/codeling/kom_i_gang/program_hei.png
    H: 480
    look: true
    text: "Første steg: få roboten til å si hei."
    term: { word: kloss, x: 0.62, y: 0.78 }
  - kind: logo
    course: cc_tweaked
    text: Etterpå koder du Minecraft med Lua.
