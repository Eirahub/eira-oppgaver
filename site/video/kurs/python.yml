# Introvideo for Python. Felter og skuddtyper: se MANUS.md.
skudd:
  - src: src/python/skilpaddefraktaler/skilpaddefraktaler.png
    look: true
    text: Kan du tegne et snøfnugg med kode?
    snow: 40
  - src: src/python/hangman2/hangman_initial_screen.png
    text: Du har spilt hangman på papir.
    pan: { scale: 1.3, from: [0.4, 0.4], to: [0.6, 0.45] }
  - src: src/python/hangman2/hangman_won_game.png
    H: 620
    look: true
    text: Nå lager du det på skjermen selv.
    pan: { scale: 1.3, from: [0.45, 0.4], to: [0.5, 0.65] }
  - kind: code
    code: |
      def fjell(lengde, dybde):
          if dybde == 1:
              forward(lengde)
              return

          fjell(lengde / 3, dybde - 1)
          left(60)
          fjell(lengde / 3, dybde - 1)
          right(120)
          fjell(lengde / 3, dybde - 1)
          left(60)
          fjell(lengde / 3, dybde - 1)
    text: En funksjon som tegner fjell i fjell
  - src: src/python/skilpaddekunst/skilpaddekunst.png
    look: true
    text: Kunst som skilpadden tegner for deg
    pan: { scale: 1.4, from: [0.38, 0.55], to: [0.6, 0.45] }
  - kind: code
    code: |
      print(' ____________________')
      print('< Python er morsomt! >')
      print(' --------------------')
      print('     \   ^__^')
      print('      \  (oo)\_______')
      print('         (__)\       )')
      print('             ||----W |')
      print('             ||     ||')
    text: "Første steg: få en ku til å snakke."
  - kind: logo
    course: processing
    text: Etterpå kan du lage spill i Processing.
