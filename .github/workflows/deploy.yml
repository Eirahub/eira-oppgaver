name: Bygg og publiser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:site
      - run: npm test
      # Also on pull requests: the preview job below deploys the same files.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Preview per pull request on Cloudflare Pages (GitHub Pages has no previews).
  # Skips with a notice when the Cloudflare secrets are missing, e.g. PRs from forks.
  preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice title=Ingen forhåndsvisning::CLOUDFLARE_API_TOKEN eller CLOUDFLARE_ACCOUNT_ID mangler (ikke satt opp, eller PR fra en fork). Hopper over."
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: github-pages
      - if: env.HAS_CLOUDFLARE == 'true'
        run: mkdir dist && tar -xf artifact.tar -C dist
      - id: deploy
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=eira-oppgaver --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }}
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- eira-forhandsvisning -->';
            const body = [marker, `Forhåndsvisning: ${process.env.PREVIEW_URL}`, '', `Oppdatert for ${context.payload.pull_request.head.sha.slice(0, 7)}.`].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # Demo of the LKK profile on Cloudflare Pages (https://lkk-demo.eira-oppgaver.pages.dev).
  # Not indexed by search engines. Skips with a notice when the Cloudflare secrets are missing.
  lkk-demo:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      SITE_PROFILE: lkk
      SITE_NOINDEX: '1'
    steps:
      - if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice title=Ingen LKK-demo::CLOUDFLARE_API_TOKEN eller CLOUDFLARE_ACCOUNT_ID mangler. Hopper over."
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: env.HAS_CLOUDFLARE == 'true'
        working-directory: site
        run: |
          npm ci
          npm run build
          npm run check:site
          rm -f dist/CNAME
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=eira-oppgaver --branch=lkk-demo --commit-hash=${{ github.sha }}
